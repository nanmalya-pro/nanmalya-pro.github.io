<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lottie 모션 테스터</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: #1a1c22;
    color: #e8eaf0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid #2c2f38;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header h1 span { color: #7c8493; font-weight: 400; font-size: 13px; margin-left: 8px; }
  .file-name { font-size: 13px; color: #9aa3b5; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 20px;
  }

  /* 드롭존 */
  #dropzone {
    width: min(720px, 92vw);
    height: min(480px, 60vh);
    border: 2px dashed #3a3f4d;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    position: relative;
    overflow: hidden;
  }
  #dropzone.dragover { border-color: #00c4a0; background: rgba(0,196,160,.06); }
  #dropzone.checker { background-image:
      linear-gradient(45deg, #23262e 25%, transparent 25%),
      linear-gradient(-45deg, #23262e 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #23262e 75%),
      linear-gradient(-45deg, transparent 75%, #23262e 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0;
  }
  #dropzone.bg-white { background: #ffffff; }
  #dropzone.bg-black { background: #000000; }
  #dropzone.has-anim { border-style: solid; border-color: #2c2f38; cursor: default; }

  .placeholder { text-align: center; color: #7c8493; pointer-events: none; }
  .placeholder .icon { font-size: 40px; margin-bottom: 6px; }
  .placeholder strong { color: #c9cfdb; font-weight: 600; display:block; margin-bottom: 4px; font-size: 15px;}
  .placeholder small { font-size: 12.5px; }

  #lottie-container { width: 100%; height: 100%; display: none; }
  #lottie-container svg { width: 100% !important; height: 100% !important; }

  /* 컨트롤 */
  #controls {
    width: min(720px, 92vw);
    background: #22252d;
    border: 1px solid #2c2f38;
    border-radius: 14px;
    padding: 16px 18px;
    display: none;
    flex-direction: column;
    gap: 14px;
  }
  #controls.visible { display: flex; }

  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  button {
    background: #2e323d;
    color: #e8eaf0;
    border: 1px solid #3a3f4d;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s;
    font-family: inherit;
  }
  button:hover { background: #3a3f4d; }
  button.primary { background: #00c4a0; border-color: #00c4a0; color: #0c221d; font-weight: 600; }
  button.primary:hover { background: #00dcb4; }
  button.toggled { background: #00c4a0; border-color: #00c4a0; color: #0c221d; }

  input[type="range"] { flex: 1; accent-color: #00c4a0; min-width: 120px; }

  label.small { font-size: 12px; color: #9aa3b5; white-space: nowrap; }
  .value { font-size: 12px; color: #c9cfdb; min-width: 70px; text-align: right; font-variant-numeric: tabular-nums; }

  .divider { width: 1px; height: 22px; background: #3a3f4d; }

  .info {
    display: flex;
    gap: 18px;
    font-size: 12px;
    color: #7c8493;
    flex-wrap: wrap;
  }
  .info b { color: #c9cfdb; font-weight: 500; }

  #error {
    display: none;
    width: min(720px, 92vw);
    background: rgba(255,90,90,.1);
    border: 1px solid rgba(255,90,90,.4);
    color: #ff9b9b;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1>🎬 Lottie 모션 테스터 <span>피그마에서 추출한 JSON 확인용</span></h1>
  <div class="file-name" id="fileName">파일 없음</div>
</header>

<main>
  <div id="dropzone" class="checker">
    <div class="placeholder" id="placeholder">
      <div class="icon">📂</div>
      <strong>Lottie JSON 파일을 여기로 드래그하세요</strong>
      <small>또는 클릭해서 파일 선택 (.json, .lottie 중 json만 지원)</small>
    </div>
    <div id="lottie-container"></div>
  </div>

  <div id="error"></div>

  <div id="controls">
    <!-- 재생 컨트롤 + 진행바 -->
    <div class="row">
      <button id="btnPlay" class="primary">⏸ 일시정지</button>
      <button id="btnStop">⏹ 처음으로</button>
      <button id="btnLoop" class="toggled">🔁 루프</button>
      <div class="divider"></div>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      <div class="value" id="frameInfo">0 / 0</div>
    </div>

    <!-- 속도 / 배경 -->
    <div class="row">
      <label class="small">속도</label>
      <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1" style="max-width:160px">
      <div class="value" id="speedVal">1.0x</div>
      <div class="divider"></div>
      <label class="small">배경</label>
      <button data-bg="checker" class="bgBtn toggled">체커</button>
      <button data-bg="white" class="bgBtn">흰색</button>
      <button data-bg="black" class="bgBtn">검정</button>
      <div class="divider"></div>
      <button id="btnOther">📂 다른 파일 열기</button>
    </div>

    <!-- 애니메이션 정보 -->
    <div class="info" id="animInfo"></div>
  </div>
</main>

<input type="file" id="fileInput" accept=".json,application/json" hidden>

<script>
  const dropzone = document.getElementById('dropzone');
  const placeholder = document.getElementById('placeholder');
  const container = document.getElementById('lottie-container');
  const controls = document.getElementById('controls');
  const fileInput = document.getElementById('fileInput');
  const errorBox = document.getElementById('error');

  const btnPlay = document.getElementById('btnPlay');
  const btnStop = document.getElementById('btnStop');
  const btnLoop = document.getElementById('btnLoop');
  const btnOther = document.getElementById('btnOther');
  const seek = document.getElementById('seek');
  const speed = document.getElementById('speed');
  const speedVal = document.getElementById('speedVal');
  const frameInfo = document.getElementById('frameInfo');
  const animInfo = document.getElementById('animInfo');
  const fileNameEl = document.getElementById('fileName');

  let anim = null;
  let loop = true;
  let paused = false;
  let seeking = false;

  // ---- 파일 열기 ----
  dropzone.addEventListener('click', () => { if (!anim) fileInput.click(); });
  btnOther.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
    fileInput.value = '';
  });

  ['dragenter','dragover'].forEach(ev => dropzone.addEventListener(ev, e => {
    e.preventDefault(); dropzone.classList.add('dragover');
  }));
  ['dragleave','drop'].forEach(ev => dropzone.addEventListener(ev, e => {
    e.preventDefault(); dropzone.classList.remove('dragover');
  }));
  dropzone.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (file) loadFile(file);
  });

  function showError(msg) {
    errorBox.textContent = '⚠️ ' + msg;
    errorBox.style.display = 'block';
  }
  function hideError() { errorBox.style.display = 'none'; }

  function loadFile(file) {
    hideError();
    if (!file.name.toLowerCase().endsWith('.json')) {
      showError('JSON 파일만 지원합니다. (.lottie 파일은 압축 형식이라 이 테스터에서는 열 수 없어요 — 피그마에서 JSON으로 추출해주세요)');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try { data = JSON.parse(reader.result); }
      catch { showError('JSON 파싱에 실패했습니다. 올바른 Lottie JSON인지 확인해주세요.'); return; }
      if (data.v === undefined || data.layers === undefined) {
        showError('Lottie 형식이 아닌 것 같습니다. (v, layers 필드가 없음)');
        return;
      }
      startAnimation(data, file.name);
    };
    reader.readAsText(file);
  }

  function startAnimation(data, name) {
    if (anim) { anim.destroy(); anim = null; }
    container.innerHTML = '';
    container.style.display = 'block';
    placeholder.style.display = 'none';
    dropzone.classList.add('has-anim');
    controls.classList.add('visible');
    fileNameEl.textContent = name;
    paused = false;
    btnPlay.textContent = '⏸ 일시정지';

    anim = lottie.loadAnimation({
      container,
      renderer: 'svg',
      loop,
      autoplay: true,
      animationData: data
    });
    anim.setSpeed(parseFloat(speed.value));

    anim.addEventListener('DOMLoaded', () => {
      const total = Math.round(anim.totalFrames);
      const fr = data.fr || 30;
      const dur = (total / fr).toFixed(2);
      seek.max = total;
      animInfo.innerHTML =
        '크기 <b>' + (data.w || '?') + '×' + (data.h || '?') + '</b>' +
        '프레임레이트 <b>' + fr + 'fps</b>' +
        '총 프레임 <b>' + total + '</b>' +
        '길이 <b>' + dur + '초</b>' +
        '레이어 <b>' + (data.layers ? data.layers.length : 0) + '개</b>' +
        '버전 <b>' + (data.v || '?') + '</b>';
    });

    anim.addEventListener('enterFrame', () => {
      if (!seeking && anim) {
        seek.value = anim.currentFrame;
        frameInfo.textContent = Math.round(anim.currentFrame) + ' / ' + Math.round(anim.totalFrames);
      }
    });
  }

  // ---- 컨트롤 ----
  btnPlay.addEventListener('click', () => {
    if (!anim) return;
    if (paused) { anim.play(); btnPlay.textContent = '⏸ 일시정지'; }
    else { anim.pause(); btnPlay.textContent = '▶ 재생'; }
    paused = !paused;
  });

  btnStop.addEventListener('click', () => {
    if (!anim) return;
    anim.goToAndStop(0, true);
    paused = true;
    btnPlay.textContent = '▶ 재생';
    seek.value = 0;
  });

  btnLoop.addEventListener('click', () => {
    loop = !loop;
    btnLoop.classList.toggle('toggled', loop);
    if (anim) anim.loop = loop;
  });

  seek.addEventListener('input', () => {
    if (!anim) return;
    seeking = true;
    anim.goToAndStop(parseFloat(seek.value), true);
    frameInfo.textContent = Math.round(seek.value) + ' / ' + Math.round(anim.totalFrames);
    paused = true;
    btnPlay.textContent = '▶ 재생';
  });
  seek.addEventListener('change', () => { seeking = false; });

  speed.addEventListener('input', () => {
    speedVal.textContent = parseFloat(speed.value).toFixed(1) + 'x';
    if (anim) anim.setSpeed(parseFloat(speed.value));
  });

  document.querySelectorAll('.bgBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.bgBtn').forEach(b => b.classList.remove('toggled'));
      btn.classList.add('toggled');
      dropzone.classList.remove('checker', 'bg-white', 'bg-black');
      const bg = btn.dataset.bg;
      if (bg === 'checker') dropzone.classList.add('checker');
      else dropzone.classList.add('bg-' + bg);
    });
  });
</script>
</body>
</html>
